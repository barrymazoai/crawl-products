<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Crawl Prompt Studio</title>
  <style>
    :root {
      --ink: #17211d;
      --muted: #66716c;
      --line: #d8dfdb;
      --paper: #fffdf8;
      --wash: #edf1ed;
      --accent: #146b4d;
      --accent-dark: #0c5039;
      --focus: #f2b84b;
      --error: #a6342a;
      --shadow: 0 24px 70px rgba(31, 47, 40, .12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 8%, rgba(242, 184, 75, .18), transparent 30rem),
        radial-gradient(circle at 92% 85%, rgba(20, 107, 77, .13), transparent 34rem),
        var(--wash);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 64px 0 72px;
    }

    header { margin-bottom: 28px; }

    .header-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; }
    .status-link { display: inline-flex; align-items: center; min-height: 42px; padding: 0 15px; border: 1px solid var(--line); border-radius: 12px; color: var(--accent-dark); background: rgba(255,253,248,.8); font-size: 13px; font-weight: 800; text-decoration: none; white-space: nowrap; }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      color: var(--accent-dark);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 26px;
      height: 2px;
      background: var(--accent);
    }

    h1 {
      max-width: 760px;
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(38px, 6vw, 70px);
      font-weight: 500;
      letter-spacing: -.045em;
      line-height: .98;
    }

    .lede {
      max-width: 680px;
      margin: 20px 0 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.65;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1.08fr) minmax(300px, .72fr);
      gap: 18px;
      align-items: start;
    }

    .card {
      border: 1px solid rgba(23, 33, 29, .09);
      border-radius: 22px;
      background: rgba(255, 253, 248, .94);
      box-shadow: var(--shadow);
    }

    .input-card { padding: 24px; }
    .settings-card { padding: 24px; }

    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 10px;
    }

    h2 {
      margin: 0;
      font-size: 16px;
      letter-spacing: -.01em;
    }

    .count, .hint {
      color: var(--muted);
      font-size: 12px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #34413b;
      font-size: 13px;
      font-weight: 700;
    }

    textarea, input, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--ink);
      background: #fff;
      font: inherit;
      transition: border-color .15s ease, box-shadow .15s ease;
    }

    textarea:focus, input:focus, select:focus, button:focus-visible {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(20, 107, 77, .14);
    }

    #sites {
      min-height: 330px;
      resize: vertical;
      padding: 16px;
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 14px;
      line-height: 1.7;
    }

    .field { margin-top: 17px; }
    .field:first-of-type { margin-top: 0; }

    input, select {
      height: 44px;
      padding: 0 12px;
      font-size: 14px;
    }

    #note {
      min-height: 88px;
      padding: 12px;
      resize: vertical;
      font-size: 14px;
      line-height: 1.5;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .callout {
      margin-top: 18px;
      padding: 13px 14px;
      border-left: 3px solid var(--focus);
      border-radius: 0 10px 10px 0;
      color: #5c5140;
      background: #fff8e9;
      font-size: 12px;
      line-height: 1.55;
    }

    button {
      min-height: 46px;
      border: 0;
      border-radius: 12px;
      padding: 0 18px;
      cursor: pointer;
      font: inherit;
      font-weight: 800;
      transition: transform .15s ease, background .15s ease, opacity .15s ease;
    }

    button:hover { transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    button:disabled { cursor: wait; opacity: .62; transform: none; }

    .primary {
      width: 100%;
      margin-top: 20px;
      color: #fff;
      background: var(--accent);
    }

    .primary:hover { background: var(--accent-dark); }

    .result-card {
      display: none;
      margin-top: 18px;
      overflow: hidden;
    }

    .result-card.visible { display: block; }

    .result-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
      background: #f8faf7;
    }

    .result-meta {
      color: var(--muted);
      font-size: 13px;
    }

    .copy {
      min-height: 38px;
      color: var(--accent-dark);
      background: #e4efe9;
    }

    pre {
      min-height: 220px;
      max-height: 620px;
      margin: 0;
      padding: 22px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
      color: #eaf5ee;
      background: #15231d;
      font: 13px/1.7 "SFMono-Regular", Consolas, monospace;
    }

    .status {
      min-height: 20px;
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .status.error { color: var(--error); }

    @media (max-width: 800px) {
      main { padding-top: 38px; }
      .workspace { grid-template-columns: 1fr; }
      .settings-card { order: -1; }
      #sites { min-height: 260px; }
      .header-row { flex-direction: column; }
    }

    @media (max-width: 480px) {
      main { width: min(100% - 20px, 1120px); }
      .input-card, .settings-card { padding: 18px; }
      .row { grid-template-columns: 1fr; }
      .section-head { align-items: flex-start; flex-direction: column; gap: 4px; }
    }
  </style>
</head>
<body>
  <main>
    <header class="header-row">
      <div>
        <div class="eyebrow">Crawl Products</div>
        <h1>把网站清单变成可运行的 Prompt</h1>
        <p class="lede">一行一个网站。生成结果会先拉取最新版 Skill，再按站点拆分线程、处理证据并完成爬取验收。</p>
      </div>
      <a class="status-link" href="/status">查看任务状态</a>
    </header>

    <section class="workspace" aria-label="Prompt 生成器">
      <div class="card input-card">
        <div class="section-head">
          <h2>网站清单</h2>
          <span class="count" id="siteCount">0 个网站</span>
        </div>
        <label for="sites">网址或域名，每行一个</label>
        <textarea id="sites" spellcheck="false" placeholder="example.com&#10;https://brand.example/products&#10;another-store.com"></textarea>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </div>

      <aside class="card settings-card">
        <h2>运行参数</h2>
        <div class="field">
          <label for="browser">浏览器</label>
          <select id="browser">
            <option value="iab">Codex App Browser（IAB）</option>
            <option value="extension">本地 Chrome</option>
          </select>
        </div>
        <div class="field">
          <label for="exportMode">输出模式</label>
          <select id="exportMode">
            <option value="api">正式 API-ready</option>
            <option value="partial">Inventory partial</option>
          </select>
        </div>
        <div class="row">
          <div class="field">
            <label for="batchSize">并发线程</label>
            <input id="batchSize" type="number" min="1" max="50" value="4" inputmode="numeric">
          </div>
          <div class="field">
            <label for="maxItems">商品上限</label>
            <input id="maxItems" type="number" min="1" placeholder="全量" inputmode="numeric">
          </div>
        </div>
        <div class="field">
          <label for="note">附加说明（可选）</label>
          <textarea id="note" placeholder="例如：优先处理美国站点"></textarea>
        </div>
        <div class="callout">生成的 Prompt 会要求执行端先拉取最新的 crawl-products Skill，但不限定具体拉取命令。</div>
        <button class="primary" id="generate" type="button">生成运行 Prompt</button>
        <p class="hint">快捷键：⌘/Ctrl + Enter</p>
      </aside>
    </section>

    <section class="card result-card" id="resultCard" aria-label="生成结果">
      <div class="result-toolbar">
        <span class="result-meta" id="resultMeta">运行 Prompt</span>
        <button class="copy" id="copy" type="button">复制 Prompt</button>
      </div>
      <pre id="output" tabindex="0"></pre>
    </section>
  </main>

  <script>
    const sites = document.querySelector("#sites");
    const siteCount = document.querySelector("#siteCount");
    const status = document.querySelector("#status");
    const generate = document.querySelector("#generate");
    const copy = document.querySelector("#copy");
    const output = document.querySelector("#output");
    const resultCard = document.querySelector("#resultCard");
    const resultMeta = document.querySelector("#resultMeta");

    function lines() {
      return sites.value.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
    }

    function updateCount() {
      const count = lines().length;
      siteCount.textContent = `${count} 个网站`;
    }

    async function makePrompt() {
      status.className = "status";
      status.textContent = "";
      generate.disabled = true;
      generate.textContent = "正在生成…";

      try {
        const response = await fetch("/api/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            sites: sites.value,
            browser: document.querySelector("#browser").value,
            exportMode: document.querySelector("#exportMode").value,
            batchSize: document.querySelector("#batchSize").value,
            maxItems: document.querySelector("#maxItems").value,
            note: document.querySelector("#note").value,
          }),
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "生成失败");
        output.textContent = data.prompt;
        resultMeta.textContent = `${data.siteCount} 个网站 · 运行 Prompt`;
        resultCard.classList.add("visible");
        status.textContent = "Prompt 已生成";
        resultCard.scrollIntoView({ behavior: "smooth", block: "start" });
      } catch (error) {
        status.className = "status error";
        status.textContent = error.message || "生成失败，请重试";
      } finally {
        generate.disabled = false;
        generate.textContent = "生成运行 Prompt";
      }
    }

    async function copyPrompt() {
      if (!output.textContent) return;
      try {
        await navigator.clipboard.writeText(output.textContent);
      } catch {
        const range = document.createRange();
        range.selectNodeContents(output);
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        document.execCommand("copy");
        selection.removeAllRanges();
      }
      copy.textContent = "已复制";
      window.setTimeout(() => { copy.textContent = "复制 Prompt"; }, 1600);
    }

    sites.addEventListener("input", updateCount);
    generate.addEventListener("click", makePrompt);
    copy.addEventListener("click", copyPrompt);
    document.addEventListener("keydown", (event) => {
      if ((event.metaKey || event.ctrlKey) && event.key === "Enter") makePrompt();
    });
    updateCount();
  </script>
</body>
</html>
