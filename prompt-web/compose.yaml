services:
  crawl-prompt-web:
    build:
      context: ..
      dockerfile: prompt-web/Dockerfile
    image: crawl-prompt-web:latest
    container_name: crawl-prompt-web
    restart: unless-stopped
    ports:
      - "8787:8080"
    environment:
      STATUS_DASHBOARD_URL: http://host.docker.internal:8788
